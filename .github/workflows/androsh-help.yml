name: AndroSH Help Docs Generator

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running workflow'
        required: false
        default: 'Manual trigger'

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        [ -f requirements.txt ] && pip install -r requirements.txt

    - name: Generate Help Documentation
      run: python .github/scripts/generate_docs.py

    - name: Commit and push documentation
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p Assets/docs
        if [ -f "Assets/docs/AndroSH_Help.md" ] && cmp -s "AndroSH_Help.md" "Assets/docs/AndroSH_Help.md"; then
          echo "No changes detected - files are identical"
          exit 0
        fi
        mv AndroSH_Help.md Assets/docs/AndroSH_Help.md
        git add Assets/docs/AndroSH_Help.md
        git commit -m "docs: update AndroSH command line reference

        Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
        git push
